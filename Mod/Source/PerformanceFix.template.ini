; ==== BEGIN OBR-LowEndPerformanceFix ====
; Oblivion Remastered - Low/Mid-End Performance & Stutter Fix
; Version {{VERSION}} | Tier: {{TIER}}
; Manual preset. The game may remove these markers when rewriting Engine.ini.
; Record previous values before applying; manual installation does not create recovery state.
;
; Every cvar below was verified to exist in OblivionRemastered-Win64-Shipping.exe.
; Values are chosen relative to the game's own shipped Low/High scalability presets
; (see README). Effects on performance and visuals depend on the system and workload.
[SystemSettings]
; ---------- VRAM pressure (profiled: game hit WDDM budget, up to 415 MB demoted to system RAM) ----------
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize={{STREAMING_POOL}}
r.LumenScene.SurfaceCache.AtlasSize={{LUMEN_ATLAS}}
r.Nanite.Streaming.StreamingPoolSize={{NANITE_POOL}}

; ---------- System RAM pressure (profiled: 11.3 GB commit, less than 300 MB free) ----------
gc.LowMemory.MemoryThresholdMB={{GC_LOWMEM_MB}}
gc.LowMemory.TimeBetweenPurgingPendingKillObjects=30

; ---------- Streaming / traversal hitches ----------
; Avoid the forced full GC "to instantly reclaim memory at the expense of a hitch" when cells unload;
; memory is still reclaimed by incremental GC (s.ContinuouslyIncrementalGCWhileLevelsPendingPurge=1).
s.ForceGCAfterLevelStreamedOut=0
s.ContinuouslyIncrementalGCWhileLevelsPendingPurge=1
; Spread streaming work across frames instead of large single-frame spikes.
s.PriorityAsyncLoadingExtraTime=4
s.LevelStreamingActorsUpdateTimeLimit=4
s.PriorityLevelStreamingActorsUpdateExtraTime=2
s.UnregisterComponentsTimeLimit=1

; ---------- GPU cost (resolution-independent work; values match the game's own High preset) ----------
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.5
r.Shadow.Virtual.ResolutionLodBiasLocal=0.5
r.Shadow.Virtual.Clipmap.LastLevel=19
; Lumen scene lighting is updated over more frames (lighting changes settle a few frames later).
r.LumenScene.DirectLighting.UpdateFactor=64
r.LumenScene.Radiosity.UpdateFactor=128
r.LumenScene.SurfaceCache.CardCaptureRefreshFraction=0.0625
; ==== END OBR-LowEndPerformanceFix ====
